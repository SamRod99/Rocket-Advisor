<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Advisor</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .titulo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        button:hover {
            background: #0ea5e9;
            transform: translateY(-1px);
        }

        #resultado {
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
            color: #cbd5e1;
            padding: 10px;
            border-radius: 8px;
        }
        #sitio-info{
            margin-bottom: 20px;
            background: #1e293b;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: left;
            min-height: 44px;
        }
        #url-actual{
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="titulo">Rocket-Advisor</div>

    <div id="sitio-info">
        <span id="url-actual">Cargando...</span>
    </div>

    <button id="btn">Ver resultados</button>

    <p id="resultado">Sin análisis</p>

    <script src="popup.js"></script>

</body>
</html>
